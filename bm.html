<style>
/* Layout: phone-first, one screen (100dvh): header, chip rows, progress bar, big tap card, nav bar, list button; the list opens full-screen */
:root{
  --bg:#eef1f4; --surface:#ffffff; --fg:#17202b; --muted:#5b6876; --line:#d3dae2;
  --accent:#1d5fa8; --accent-fg:#ffffff; --good:#1f7a4d; --bad:#b53a2e; --back:#f6efe1; --star:#c98a00;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",sans-serif;
  --zh:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161d; --surface:#1a222c; --fg:#e7ecf1; --muted:#97a3b0; --line:#2c3743;
  --accent:#6ea8ec; --accent-fg:#0d1620; --good:#4cc08a; --bad:#ec7a6c; --back:#262019; --star:#f2c14e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161d; --surface:#1a222c; --fg:#e7ecf1; --muted:#97a3b0; --line:#2c3743;
  --accent:#6ea8ec; --accent-fg:#0d1620; --good:#4cc08a; --bad:#ec7a6c; --back:#262019; --star:#f2c14e; color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;-webkit-tap-highlight-color:transparent}
.app{max-width:520px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;gap:10px;overflow:hidden;box-sizing:border-box;
  padding:max(10px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex:none}
h1{font-family:var(--display);font-weight:700;font-size:1.2rem;margin:0;letter-spacing:-.01em}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem}
.chips{display:flex;gap:6px;overflow-x:auto;flex:none;scrollbar-width:none;margin-inline:-14px;padding-inline:14px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;white-space:nowrap;font:inherit;font-size:.85rem;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);
  border-radius:999px;padding:7px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.chip:focus-visible,.btn:focus-visible,.card:focus-visible,.star:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chip small{opacity:.7;font-variant-numeric:tabular-nums}
.bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;flex:none}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.stage{flex:1;min-height:0;display:flex;flex-direction:column}
.card{position:relative;flex:1;min-height:0;perspective:1200px;cursor:pointer;touch-action:pan-y;user-select:none;-webkit-user-select:none;text-align:center}
.inner{position:absolute;inset:0;transition:transform .45s;transform-style:preserve-3d}
.card.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;overflow:hidden;
  border:1.5px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:48px 20px 40px;box-sizing:border-box}
.face.back{transform:rotateY(180deg);background:var(--back)}
.star{position:absolute;top:6px;right:6px;z-index:3;width:46px;height:46px;border:0;background:none;font-size:1.7rem;line-height:1;color:var(--muted);cursor:pointer;border-radius:50%;padding:0}
.star[aria-pressed="true"]{color:var(--star)}
.pic{width:min(104px,18vh);height:min(104px,18vh);flex:none;color:var(--fg)}
.pic svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
.tag{position:absolute;top:16px;left:16px;right:60px;text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.hint{position:absolute;bottom:14px;left:0;right:0;font-size:.8rem;color:var(--muted)}
.word{font-size:clamp(1.6rem,8vw,2.1rem);line-height:1.2;overflow-wrap:anywhere;text-wrap:balance}
.word.bm{font-family:var(--display);font-weight:700}
.word.zh{font-family:var(--zh);font-weight:600}
.sub{font-size:1.05rem;color:var(--muted);overflow-wrap:anywhere}
.sub.zh{font-family:var(--zh)}
.nota{font-size:.95rem;border-top:1px dashed var(--line);padding-top:10px;max-width:100%;overflow-wrap:anywhere;font-family:var(--zh)}
.nav{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:8px;flex:none}
.nav button{font:inherit;font-size:1.05rem;border-radius:14px;padding:14px 0;cursor:pointer;background:var(--surface);color:var(--fg);border:1.5px solid var(--line)}
.nav .mid{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
.listbtn{flex:none;background:none;border:none;color:var(--muted);font:inherit;font-size:.95rem;padding:2px 0;cursor:pointer}
.empty{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);padding:20px}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;max-width:520px;margin:0 auto;box-sizing:border-box;
  padding:env(safe-area-inset-top,0px) max(14px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(14px,env(safe-area-inset-left,0px))}
.sheet header{padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.sheet header h2{font-size:1rem;margin:0;font-weight:600}
.sheet header button{font:inherit;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:8px 14px;cursor:pointer}
.jlist{overflow-y:auto;flex:1}
.jrow{display:flex;gap:10px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.jrow.cur{background:var(--surface)}
.jrow .s{border:0;background:none;font-size:1.3rem;color:var(--muted);padding:0 4px;cursor:pointer}
.jrow .s.on{color:var(--star)}
.jrow .n{color:var(--muted);font-size:.75rem;min-width:28px;font-variant-numeric:tabular-nums}
.jrow .q{min-width:0;overflow-wrap:anywhere}
.jrow .q.zh{font-family:var(--zh)}
@media (prefers-reduced-motion: reduce){.inner,.bar i{transition:none}}
</style>

<div class="app">
  <header><h1>Kad Imbas BM</h1><span class="count" id="count"></span></header>

  <div class="chips" id="dirChips" role="group" aria-label="Arah">
    <button class="chip" data-dir="bm">BM → 中文</button>
    <button class="chip" data-dir="zh">中文 → BM</button>
    <button class="chip" data-dir="mix">Campur</button>
    <button class="chip" id="shuffle" aria-pressed="false">🔀 Kocok</button>
  </div>
  <div class="chips" id="groupChips" role="group" aria-label="Topik"></div>

  <div class="bar"><i id="bar"></i></div>

  <div class="stage" id="stage">
    <div class="card" id="card" role="button" tabindex="0" aria-label="Kad: ketik untuk terbalikkan, leret untuk tukar kad">
      <button class="star" id="star" aria-label="Bintang perkataan ini" aria-pressed="false">☆</button>
      <div class="inner" id="inner">
        <div class="face front"><span class="tag" id="tagF"></span><div id="front"></div><span class="hint">ketik untuk lihat jawapan</span></div>
        <div class="face back"><span class="tag" id="tagB"></span><div id="back"></div></div>
      </div>
    </div>
    <div class="empty" id="empty" hidden></div>
  </div>

  <div class="nav">
    <button id="prev" aria-label="Kad sebelum">←</button>
    <button class="mid" id="flip">Balik</button>
    <button id="next" aria-label="Kad seterusnya">→</button>
  </div>
  <button class="listbtn" id="openList">☰ Lihat semua kad (ketik untuk lompat)</button>
</div>

<div class="sheet" id="sheet" hidden>
  <header><h2 id="sheetTitle"></h2><button id="closeList">Tutup</button></header>
  <div class="jlist" id="jlist"></div>
</div>

function pic(k){return PIC[k]?'<div class="pic"><svg viewBox="0 0 100 100" aria-hidden="true">'+PIC[k]+'</svg></div>':""}
const KEY="bm-kad-imbas-v1";
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}}
const store=Object.assign({dir:"bm",groups:["all"],star:{},shuffled:false},load());
if(!store.star)store.star={};
const STAR_SEED=["melepaskan","kesempitan","kesudahan","kesempurnaan","kerat","kerak","keras","menghadapi","menjaringkan","bersorak","penyampaian","diperbuat daripada","bertolak","sempena","cincin","rantai","bersenam","kesempatan / peluang","kerap","bimbang"];
if(!store.seeded)store.seeded={};
STAR_SEED.forEach(k=>{if(!store.seeded[k]){store.star[k]=1;store.seeded[k]=1}});save();
if(store.groups.includes("hard"))store.groups=["all"];

const $=id=>document.getElementById(id);
const card=$("card"),inner=$("inner");
let deck=[],pos=0,flipped=false;
const SPECIAL=["all","star"];

function counts(){const c={};W.forEach(w=>c[w[3]]=(c[w[3]]||0)+1);return c}
function starList(){return W.filter(w=>store.star[w[0]])}
function renderChips(){
  const c=counts(),box=$("groupChips");box.innerHTML="";
  const mk=(key,name,n)=>{const b=document.createElement("button");b.className="chip";
    b.setAttribute("aria-pressed",store.groups.includes(key));b.innerHTML=name+" <small>"+n+"</small>";
    b.onclick=()=>toggleGroup(key);box.appendChild(b)};
  mk("all","Semua",W.length);
  mk("star","★ Bintang",starList().length);
  Object.keys(G).forEach(k=>mk(k,G[k],c[k]||0));
  document.querySelectorAll("#dirChips [data-dir]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.dir===store.dir));
  $("shuffle").setAttribute("aria-pressed",!!store.shuffled);
}
function toggleGroup(k){
  if(SPECIAL.includes(k)){store.groups=[k]}
  else{let g=store.groups.filter(x=>!SPECIAL.includes(x));
    g=g.includes(k)?g.filter(x=>x!==k):g.concat(k);store.groups=g.length?g:["all"]}
  save();renderChips();build();
}
function pool(){
  if(store.groups.includes("all"))return W.slice();
  if(store.groups.includes("star"))return starList();
  return W.filter(w=>store.groups.includes(w[3]));
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function build(){
  let src=pool(); if(store.shuffled)src=shuffle(src);
  deck=src.map(w=>({w,side:store.dir==="mix"?(Math.random()<.5?"bm":"zh"):store.dir}));
  pos=0; show();
}
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]))}
function setStar(){const on=!!(deck[pos]&&store.star[deck[pos].w[0]]);$("star").textContent=on?"★":"☆";$("star").setAttribute("aria-pressed",on)}
function show(){
  const has=deck.length>0;
  card.hidden=!has;$("empty").hidden=has;
  if(!has){
    $("empty").textContent=store.groups.includes("star")?"Belum ada perkataan berbintang. Tekan ☆ pada kad untuk simpan.":"Tiada kad.";
    $("count").textContent="0 kad";$("bar").style.width="0";return}
  const cur=deck[pos];flipped=false;
  inner.style.transition="none";card.classList.remove("flipped");void inner.offsetWidth;inner.style.transition="";
  const [bm,zh,nota,g]=cur.w,tag=G[g];
  $("tagF").textContent=tag;$("tagB").textContent=tag;
  const bmEl='<div class="word bm">'+esc(bm)+'</div>',zhEl='<div class="word zh">'+esc(zh)+'</div>';
  $("front").innerHTML=cur.side==="bm"?bmEl:zhEl;
  const sub=cur.side==="bm"?'<div class="sub">'+esc(bm)+'</div>':'<div class="sub zh">'+esc(zh)+'</div>';
  $("back").innerHTML=pic(bm)+(cur.side==="bm"?zhEl:bmEl)+sub+(nota?'<div class="nota">'+esc(nota)+'</div>':"");
  setStar();
  $("count").textContent=(pos+1)+" / "+deck.length;
  $("bar").style.width=((pos+1)/deck.length*100)+"%";
}
function flip(){if(!deck.length)return;flipped=!flipped;card.classList.toggle("flipped",flipped)}
function go(d){if(!deck.length)return;pos=(pos+d+deck.length)%deck.length;show()}
function toggleStar(k){if(store.star[k])delete store.star[k];else store.star[k]=1;save();renderChips()}

/* tap = flip; swipe left = next card, swipe right = previous card */
let sx=0,sy=0,down=false;
card.addEventListener("pointerdown",e=>{if(e.target.closest(".star"))return;down=true;sx=e.clientX;sy=e.clientY});
card.addEventListener("pointerup",e=>{
  if(!down)return;down=false;
  const dx=e.clientX-sx,dy=e.clientY-sy;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy))go(dx<0?1:-1);
  else if(Math.abs(dx)<12&&Math.abs(dy)<12)flip();
});
card.addEventListener("pointercancel",()=>{down=false});
$("star").onclick=e=>{e.stopPropagation();if(!deck.length)return;toggleStar(deck[pos].w[0]);setStar()};
$("prev").onclick=()=>go(-1);$("next").onclick=()=>go(1);$("flip").onclick=flip;
$("shuffle").onclick=()=>{store.shuffled=!store.shuffled;save();renderChips();build()};
document.querySelectorAll("#dirChips [data-dir]").forEach(b=>b.onclick=()=>{store.dir=b.dataset.dir;save();renderChips();build()});

/* ☰ list: every card's front; tap a row = jump to it */
function renderList(scroll){
  $("sheetTitle").textContent=deck.length+" kad (ketik untuk lompat)";
  $("jlist").innerHTML=deck.map((c,i)=>{const [bm,zh]=c.w,on=!!store.star[bm];
    return '<div class="jrow'+(i===pos?" cur":"")+'" data-jump="'+i+'"><button class="s'+(on?" on":"")+'" data-star="'+i+'" aria-label="Bintang">★</button><span class="n">'+(i+1)+'</span><span class="q'+(c.side==="zh"?" zh":"")+'">'+esc(c.side==="bm"?bm:zh)+'</span></div>'}).join("");
  if(scroll){const r=$("jlist").querySelector(".cur");if(r)r.scrollIntoView({block:"center"})}
}
$("openList").onclick=()=>{$("sheet").hidden=false;renderList(true)};
$("closeList").onclick=()=>{
  $("sheet").hidden=true;
  if(store.groups.includes("star")){const k=deck[pos]&&deck[pos].w[0];build();const i=deck.findIndex(c=>c.w[0]===k);if(i>=0){pos=i;show()}}
  else setStar();
};
$("jlist").addEventListener("click",e=>{
  const s=e.target.closest("[data-star]");
  if(s){e.stopPropagation();const i=+s.dataset.star;toggleStar(deck[i].w[0]);s.classList.toggle("on",!!store.star[deck[i].w[0]]);return}
  const r=e.target.closest("[data-jump]");if(!r)return;
  pos=+r.dataset.jump;$("sheet").hidden=true;show();
});

document.addEventListener("keydown",e=>{
  if(!$("sheet").hidden)return;
  if(e.target.closest&&e.target.closest("button"))return;
  if(e.key===" "||e.key==="Enter"){e.preventDefault();flip()}
  else if(e.key==="ArrowRight")go(1);
  else if(e.key==="ArrowLeft")go(-1);
  else if(e.key==="s"||e.key==="S")$("star").click();
});
renderChips();build();
</script>
